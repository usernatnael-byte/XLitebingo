<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lite Bingo</title>
    <style>
        body {
            background-color: #121824;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding-bottom: 70px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background-color: #1a2232;
            border-bottom: 1px solid #2a3447;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background-color: #8b5cf6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .wallet-box {
            background-color: #1e293b;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            text-align: right;
        }
        .wallet-box span {
            color: #22c55e;
            font-weight: bold;
        }
        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 15px;
        }
        .stat-card {
            background-color: #1e293b;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            border: 1px solid #2a3447;
        }
        .stat-label {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 18px;
            font-weight: bold;
        }
        .current-ball-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
        }
        .current-ball {
            width: 80px;
            height: 80px;
            background-color: #ffffff;
            color: #121824;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
            margin-bottom: 10px;
        }
        .section-title {
            padding: 0 15px;
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .master-board-btn {
            margin: 0 15px 15px 15px;
            background-color: #1e293b;
            border: 1px solid #2a3447;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .cartel-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 0 15px;
        }
        .cartel-card {
            background-color: #1e293b;
            border: 1px solid #2a3447;
            border-radius: 10px;
            padding: 10px;
        }
        .cartel-header {
            font-size: 12px;
            color: #38bdf8;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #1a2232;
            border-top: 1px solid #2a3447;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            color: #94a3b8;
            font-size: 10px;
            cursor: pointer;
        }
        .nav-item.active {
            color: #38bdf8;
        }
        .winner-banner {
            background-color: #10b981;
            color: white;
            text-align: center;
            padding: 10px;
            margin: 15px;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <div class="avatar" id="user-initial">N</div>
            <div>
                <div style="font-weight: bold; font-size: 14px;" id="username">Nhatty</div>
                <div style="font-size: 11px; color: #94a3b8;" id="user-phone">+251949196145</div>
            </div>
        </div>
        <div class="wallet-box">
            <div>PLAY WALLET <span id="balance">0.00</span></div>
            <div style="font-size: 10px; color: #94a3b8; margin-top: 2px;">MAIN: <span id="main-balance" style="color: #cbd5e1;">999920.00</span></div>
        </div>
    </div>

    <div id="winner-container"></div>

    <div class="stats-container">
        <div class="stat-card">
            <div class="stat-label">BALLS</div>
            <div class="stat-value" id="balls-count">0/75</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">PRIZE</div>
            <div class="stat-value" id="prize-pool">0.00 ETB</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">ROUND</div>
            <div class="stat-value" id="round-id">r1</div>
        </div>
    </div>

    <div class="current-ball-container">
        <div class="current-ball" id="current-ball">--</div>
        <div style="font-size: 12px; color: #94a3b8;">አሁን የወጣ ቁጥር (Current Ball)</div>
    </div>

    <div class="master-board-btn">
        <span>👁️ ሙሉ ቦርድ ማስተዋል (Master Board)</span>
        <span>▼</span>
    </div>

    <div class="section-title">የወጡ ቁጥሮች (Called Balls)</div>
    <div style="padding: 0 15px; font-size: 13px; color: #38bdf8; word-break: break-all;" id="called-balls-list">
        የሉም...
    </div>

    <div class="nav-bar">
        <div class="nav-item">🏠<br>Home</div>
        <div class="nav-item active">🎫<br>Ticket</div>
        <div class="nav-item">💰<br>Wallet</div>
        <div class="nav-item">🏆<br>Rank</div>
        <div class="nav-item">⚙️<br>Profile</div>
    </div>

    <script>
        const userId = "test_user";

        function fetchGameState() {
            fetch(`/api/round?userId=${userId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") {
                        document.getElementById('balance').innerText = parseFloat(data.balance).toFixed(2);
                        
                        const state = data.state;
                        document.getElementById('round-id').innerText = state.round_id;
                        document.getElementById('prize-pool').innerText = parseFloat(state.pool).toFixed(2) + " ETB";
                        
                        const drawn = state.drawn || [];
                        document.getElementById('balls-count').innerText = `${drawn.length}/75`;
                        document.getElementById('called-balls-list').innerText = drawn.length > 0 ? drawn.join(', ') : "የሉም...";
                        
                        const currentBall = state.current_ball !== null ? state.current_ball : "--";
                        document.getElementById('current-ball').innerText = currentBall;

                        // Winner banner
                        const winnerContainer = document.getElementById('winner-container');
                        if (state.winners && state.winners.length > 0) {
                            const w = state.winners[0];
                            winnerContainer.innerHTML = `<div class="winner-banner">🎉 አሸናፊ: ${w.name} (ካርቴል #${w.cartela_id}) - ሽልማት: ${w.prize} ETB</div>`;
                        } else {
                            winnerContainer.innerHTML = '';
                        }
                    }
                })
                .catch(err => console.error("Error fetching state:", err));
        }

        // በየ 2 ሰኮንዱ ሰርቨሩን ማነጋገር
        setInterval(fetchGameState, 2000);
        fetchGameState();
    </script>
</body>
</html>
