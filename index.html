<!DOCTYPE html>
<html lang="am" class="h-full bg-[#050505]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Melbet Bingo - Maintenance</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'mel-black': '#050505',
            'mel-card': '#121212',
            'mel-border': '#222222',
            'mel-gold': '#ffb700',
            'mel-gold-dark': '#cca100'
          }
        }
      }
    }
  </script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { touch-action: manipulation; user-select: none; }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
    .animate-glow { animation: pulseGlow 3s infinite ease-in-out; }
  </style>
</head>
<body class="h-full text-white font-sans antialiased flex flex-col justify-between items-center p-6 overflow-hidden select-none">

  <!-- TOP HEADER BRAND -->
  <header class="w-full max-w-md py-4 flex justify-center items-center">
    <div class="flex items-center space-x-2">
      <span class="text-xl font-black tracking-wider text-white">MELBET</span>
      <span class="bg-yellow-400 text-slate-950 font-black text-xs px-2 py-0.5 rounded-md tracking-widest">BINGO</span>
    </div>
  </header>

  <!-- MAINTENANCE CONTAINER -->
  <main class="w-full max-w-sm flex-1 flex flex-col items-center justify-center text-center px-4">
    <!-- Icon Container -->
    <div class="relative w-24 h-24 mb-6 flex items-center justify-center">
      <div class="absolute inset-0 bg-yellow-500/20 rounded-full blur-xl animate-glow"></div>
      <div class="relative w-20 h-20 bg-[#141414] border-2 border-yellow-400/50 rounded-3xl flex items-center justify-center shadow-2xl text-yellow-400 text-3xl">
        <i class="fa-solid fa-screwdriver-wrench animate-bounce"></i>
      </div>
    </div>

    <!-- Title -->
    <h1 class="text-2xl font-black text-white tracking-wide mb-2">
      የጥገና ሥራ እየተከናወነ ነው!
    </h1>
    <h2 class="text-xs font-bold text-yellow-400 tracking-widest uppercase mb-6">
      SYSTEM MAINTENANCE
    </h2>

    <!-- Description Card -->
    <div class="bg-[#141414] border border-mel-border rounded-2xl p-5 shadow-xl w-full text-center space-y-4">
      <p class="text-xs text-gray-300 leading-relaxed">
        ውድ ተጫዋቾቻችን፣ ሲስተማችንን ይበልጥ ለማዘመን እና የተሻለ አገልግሎት ለመስጠት አጭር የጥገና ሥራ እያካሄድን ይገኛል።
      </p>

      <div class="bg-[#0a0a0a] border border-mel-border rounded-xl p-3">
        <div class="text-[10px] text-gray-400 mb-1">የሚመለስበት ግምታዊ ጊዜ</div>
        <div class="text-sm font-black text-yellow-400 font-mono">
          ነገ ከሰዓት ተስተካክሎ ይጀምራል!
        </div>
      </div>

      <p class="text-[11px] text-gray-400">
        እስከዚያው ድረስ በትዕግስት እንዲጠብቁ በአክብሮት እንጠይቃለን። እናመሰግናለን! 🙏
      </p>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="w-full max-w-md py-4 text-center text-[10px] text-gray-500 font-mono">
    &copy; 2026 Melbet Bingo. All rights reserved.
  </footer>

</body>
</html>
