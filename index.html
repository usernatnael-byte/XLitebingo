<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Keno • Aviator • Bingo — Server Room</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --ig-grad: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      --ig-soft: rgba(220, 39, 67, 0.08);
      --ig-rose: #dc2743;
      --bg-page: #ffffff;
      --bg-panel: #fafafa;
      --bg-card: #ffffff;
      --line: #efefef;
      --line-mid: #dbdbdb;
      --ink: #262626;
      --muted: #737373;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg-page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Ethiopic", sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 440px;
      background: var(--bg-page);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-bar { height: 3px; width: 100%; background: var(--ig-grad); }

    header {
      position: sticky; top: 0; z-index: 30;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      padding: 10px 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }

    .brand { font-size: 14px; font-weight: 900; }
    .brand span {
      background: var(--ig-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .bal-box {
      background: var(--bg-panel); border: 1px solid var(--line-mid);
      border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 800;
    }
    .bal-box b { color: var(--ig-rose); font-weight: 900; }

    .status-tag {
      font-size: 10px; font-weight: 900; padding: 4px 8px; border-radius: 999px;
      border: 1px solid var(--line-mid); background: var(--bg-panel); color: var(--muted);
    }
    .status-tag.online { border-color: var(--ig-rose); color: var(--ig-rose); background: var(--ig-soft); }

    .room-nav {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      padding: 8px 12px; background: var(--bg-panel); border-bottom: 1px solid var(--line);
    }

    .r-btn {
      background: var(--bg-card); border: 1px solid var(--line-mid); border-radius: 8px;
      padding: 8px 6px; font-size: 11px; font-weight: 800; color: var(--muted); cursor: pointer;
    }
    .r-btn.active { background: var(--ig-grad); border-color: transparent; color: #ffffff; }

    .main { padding: 12px; flex: 1; }

    .offline-card {
      background: var(--bg-panel); border: 1px solid var(--line-mid); border-radius: 12px;
      padding: 18px 14px; text-align: center; margin-top: 12px;
    }
    .offline-card h2 { font-size: 15px; font-weight: 900; margin-bottom: 6px; }
    .offline-card p { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 12px; }

    .btn-grad {
      background: var(--ig-grad); color: #ffffff; border: none; border-radius: 8px;
      padding: 9px 14px; font-size: 12px; font-weight: 900; cursor: pointer;
    }
    .btn-grad:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-sec {
      background: var(--bg-panel); color: var(--ink); border: 1px solid var(--line-mid);
      border-radius: 8px; padding: 9px 12px; font-size: 12px; font-weight: 800; cursor: pointer;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .info-box {
      background: var(--bg-panel); border: 1px solid var(--line-mid); border-radius: 10px;
      padding: 10px 12px; margin-bottom: 10px; font-size: 12px;
    }
    .info-box .line {
      display: flex; justify-content: space-between; margin-bottom: 5px; font-weight: 700;
    }
    .info-box .line:last-child { margin-bottom: 0; }
    .info-box .k { color: var(--muted); }
    .info-box .v { color: var(--ink); font-weight: 900; }

    .keno-nums {
      display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-bottom: 10px;
    }
    .k-num {
      aspect-ratio: 1; background: var(--bg-panel); border: 1px solid var(--line-mid);
      border-radius: 6px; font-size: 11px; font-weight: 700; color: var(--ink); cursor: pointer;
    }
    .k-num.sel { background: var(--ig-grad); border-color: transparent; color: #ffffff; font-weight: 900; }

    .row-actions { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .num-input {
      width: 100px; height: 38px; background: var(--bg-panel); border: 1px solid var(--line-mid);
      border-radius: 8px; padding: 0 8px; font-size: 13px; font-weight: 800; color: var(--ink);
    }

    .mult-screen {
      background: var(--bg-panel); border: 1px solid var(--line-mid); border-radius: 12px;
      padding: 20px 12px; text-align: center; margin-bottom: 10px;
    }
    .mult-num {
      font-size: 32px; font-weight: 900;
      background: var(--ig-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .bingo-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 10px;
    }
    .b-cell {
      aspect-ratio: 1.1; background: var(--bg-panel); border: 1px solid var(--line-mid);
      border-radius: 7px; display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800; color: var(--ink);
    }
    .b-cell.called { background: var(--ig-grad); border-color: transparent; color: #ffffff; }

    .toast {
      position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
      background: var(--bg-card); border: 1px solid var(--ig-rose); color: var(--ink);
      padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 800;
      z-index: 95; opacity: 0; pointer-events: none; transition: opacity 0.2s;
      white-space: nowrap; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-bar"></div>
    <header>
      <div class="brand">ROOM <span>HUB</span></div>
      <div class="bal-box"><span id="balanceVal">--</span> <b>ETB</b></div>
      <div class="status-tag" id="statusTag">OFFLINE</div>
    </header>

    <div class="room-nav">
      <button class="r-btn active" data-tab="keno" onclick="switchRoom('keno', this)">FAST KENO</button>
      <button class="r-btn" data-tab="aviator" onclick="switchRoom('aviator', this)">AVIATOR</button>
      <button class="r-btn" data-tab="bingo" onclick="switchRoom('bingo', this)">BINGO</button>
    </div>

    <div class="main">
      <div class="offline-card" id="offlineBox">
        <h2>ሰርቨር አልተገናኘም</h2>
        <p>ይህ ገጽ ያለ ሰርቨር ግንኙነት አይሰራም። የNode + Socket.IO ሰርቨሩን ያስነሱ እና በድጋሚ ያገናኙ።</p>
        <button class="btn-grad" onclick="connectServer()">Reconnect Server</button>
      </div>

      <div id="roomsContainer" style="display:none;">
        <!-- KENO ROOM -->
        <div class="panel active" id="panel-keno">
          <div class="info-box">
            <div class="line"><span class="k">Room</span><span class="v">Fast Keno Room</span></div>
            <div class="line"><span class="k">Round</span><span class="v" id="kenoRound">--</span></div>
            <div class="line"><span class="k">Phase</span><span class="v" id="kenoPhase">--</span></div>
          </div>
          <div class="keno-nums" id="kenoGrid"></div>
          <div class="row-actions">
            <input type="number" id="kenoBetAmt" class="num-input" value="10" min="1" />
            <button class="btn-grad" style="flex:1" id="kenoBetBtn" onclick="sendKenoBet()">Bet Keno</button>
          </div>
        </div>

        <!-- AVIATOR ROOM -->
        <div class="panel" id="panel-aviator">
          <div class="info-box">
            <div class="line"><span class="k">Room</span><span class="v">Aviator Room</span></div>
            <div class="line"><span class="k">Round</span><span class="v" id="avRound">--</span></div>
            <div class="line"><span class="k">Phase</span><span class="v" id="avPhase">--</span></div>
          </div>
          <div class="mult-screen">
            <div class="mult-num" id="avMult">1.00x</div>
          </div>
          <div class="row-actions">
            <input type="number" id="avBetAmt" class="num-input" value="10" min="1" />
            <button class="btn-grad" style="flex:1" id="avBetBtn" onclick="sendAviatorBet()">Bet Flight</button>
            <button class="btn-sec" id="avCashBtn" onclick="sendAviatorCashout()">Cash Out</button>
          </div>
        </div>

        <!-- BINGO ROOM -->
        <div class="panel" id="panel-bingo">
          <div class="info-box">
            <div class="line"><span class="k">Room</span><span class="v">Bingo Room</span></div>
            <div class="line"><span class="k">Round</span><span class="v" id="bgRound">--</span></div>
            <div class="line"><span class="k">Phase</span><span class="v" id="bgPhase">--</span></div>
          </div>
          <div class="row-actions">
            <input type="number" id="bgCartela" class="num-input" value="7" min="1" max="500" />
            <input type="number" id="bgBetAmt" class="num-input" value="10" min="1" />
            <button class="btn-grad" style="flex:1" id="bgJoinBtn" onclick="sendBingoJoin()">Join Card</button>
          </div>
          <div class="bingo-grid" id="bingoCardGrid"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let socket = null;
    let connected = false;
    let currentRoom = 'keno';
    let kenoPicks = new Set();
    let platformState = null;

    function getPlayerId() {
      const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
      if (tgUser && tgUser.id) return String(tgUser.id);
      const q = new URLSearchParams(window.location.search).get('playerId');
      return q ? String(q) : '';
    }

    const playerId = getPlayerId();

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(window._tt);
      window._tt = setTimeout(() => t.classList.remove('show'), 2200);
    }

    function setOnlineUI(isOnline) {
      connected = Boolean(isOnline);
      const tag = document.getElementById('statusTag');
      const off = document.getElementById('offlineBox');
      const area = document.getElementById('roomsContainer');

      if (connected) {
        tag.textContent = 'CONNECTED';
        tag.classList.add('online');
        off.style.display = 'none';
        area.style.display = 'block';
      } else {
        tag.textContent = 'OFFLINE';
        tag.classList.remove('online');
        off.style.display = 'block';
        area.style.display = 'none';
        document.getElementById('balanceVal').textContent = '--';
      }
    }

    function switchRoom(roomKey, btn) {
      currentRoom = roomKey;
      document.querySelectorAll('.r-btn').forEach((b) => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach((p) => p.classList.remove('active'));
      if (btn) btn.classList.add('active');
      document.getElementById(`panel-${roomKey}`).classList.add('active');
    }

    function renderKenoGrid() {
      const g = document.getElementById('kenoGrid');
      g.innerHTML = '';
      for (let i = 1; i <= 80; i++) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'k-num' + (kenoPicks.has(i) ? ' sel' : '');
        b.textContent = i;
        b.onclick = () => {
          if (!connected) return showToast('Server connection required');
          if (kenoPicks.has(i)) kenoPicks.delete(i);
          else {
            if (kenoPicks.size >= 10) return showToast('Max 10 numbers');
            kenoPicks.add(i);
          }
          renderKenoGrid();
        };
        g.appendChild(b);
      }
    }

    function renderBingoCard(card, calledNumbers = []) {
      const el = document.getElementById('bingoCardGrid');
      const nums = card?.numbers || Array.from({ length: 25 }, (_, i) => (i === 12 ? 'FREE' : i + 1));
      const calledSet = new Set(calledNumbers);
      el.innerHTML = nums.map((n) => {
        const isFree = n === 0 || n === 'FREE';
        const hit = isFree || calledSet.has(n);
        return `<div class="b-cell ${hit ? 'called' : ''}">${isFree ? 'FREE' : n}</div>`;
      }).join('');
    }

    function applyPlatformState(st) {
      if (!st) return;
      platformState = st;
      if (st.player && typeof st.player.balance === 'number') {
        document.getElementById('balanceVal').textContent = st.player.balance.toFixed(2);
      }

      const k = st.rooms?.keno;
      if (k) {
        document.getElementById('kenoRound').textContent = `#${k.roundId}`;
        document.getElementById('kenoPhase').textContent = `${k.phase} (${k.timeLeft}s)`;
        document.getElementById('kenoBetBtn').disabled = k.phase !== 'BETTING_OPEN';
      }

      const a = st.rooms?.aviator;
      if (a) {
        document.getElementById('avRound').textContent = `#${a.roundId}`;
        document.getElementById('avPhase').textContent = `${a.phase} (${a.timeLeft}s)`;
        document.getElementById('avMult').textContent = `${Number(a.multiplier || 1).toFixed(2)}x`;
        document.getElementById('avBetBtn').disabled = a.phase !== 'BETTING';
      }

      const b = st.rooms?.bingo;
      if (b) {
        document.getElementById('bgRound').textContent = `#${b.roundId}`;
        document.getElementById('bgPhase').textContent = `${b.phase} (${b.timeLeft}s)`;
        document.getElementById('bgJoinBtn').disabled = b.phase !== 'LOBBY';
        renderBingoCard(b.myCard, b.calledNumbers);
      }
    }

    function emitAction(payload, onDone) {
      if (!connected || !socket || !socket.connected) {
        return showToast('Not connected to server');
      }
      socket.emit('room:action', payload, (res) => {
        if (!res || !res.ok) {
          showToast(res?.error || 'Action rejected');
          return;
        }
        if (onDone) onDone(res);
      });
    }

    function sendKenoBet() {
      if (kenoPicks.size === 0) return showToast('Select Keno numbers');
      const betAmount = Number(document.getElementById('kenoBetAmt').value);
      emitAction({
        game: 'keno',
        type: 'bet',
        picks: Array.from(kenoPicks),
        betAmount
      }, () => {
        kenoPicks.clear();
        renderKenoGrid();
        showToast('Keno bet accepted');
      });
    }

    function sendAviatorBet() {
      const betAmount = Number(document.getElementById('avBetAmt').value);
      emitAction({ game: 'aviator', type: 'bet', betAmount }, () => {
        showToast('Aviator bet placed');
      });
    }

    function sendAviatorCashout() {
      emitAction({ game: 'aviator', type: 'cashout' }, (res) => {
        showToast(`Cashed out: +${Number(res.winAmount || 0).toFixed(2)} ETB`);
      });
    }

    function sendBingoJoin() {
      const cartelaNum = Number(document.getElementById('bgCartela').value);
      const betAmount = Number(document.getElementById('bgBetAmt').value);
      emitAction({ game: 'bingo', type: 'join', cartelaNum, betAmount }, (res) => {
        renderBingoCard(res.card, []);
        showToast(`Joined Bingo Cartela #${cartelaNum}`);
      });
    }

    async function connectServer() {
      if (!playerId) {
        setOnlineUI(false);
        return showToast('playerId required');
      }

      try {
        const r = await fetch(`/api/platform/state?playerId=${encodeURIComponent(playerId)}`);
        if (!r.ok) throw new Error('Offline');
        const data = await r.json();
        setOnlineUI(true);
        applyPlatformState(data);
      } catch (_) {
        setOnlineUI(false);
      }

      if (typeof io === 'function') {
        if (socket) socket.disconnect();
        socket = io({ auth: { playerId }, query: { playerId } });

        socket.on('connect', () => {
          setOnlineUI(true);
          socket.emit('platform:sync');
        });

        socket.on('disconnect', () => setOnlineUI(false));
        socket.on('connect_error', () => setOnlineUI(false));

        socket.on('platform:state', (st) => {
          setOnlineUI(true);
          applyPlatformState(st);
        });

        socket.on('balance:update', (d) => {
          if (typeof d?.balance === 'number') {
            document.getElementById('balanceVal').textContent = d.balance.toFixed(2);
          }
        });

        socket.on('aviator:tick', (t) => {
          document.getElementById('avMult').textContent = `${Number(t.multiplier || 1).toFixed(2)}x`;
          document.getElementById('avPhase').textContent = t.phase;
        });

        socket.on('aviator:state', () => socket.emit('platform:sync'));

        socket.on('bingo:call', (ev) => {
          if (platformState?.rooms?.bingo) {
            platformState.rooms.bingo.calledNumbers = ev.calledNumbers || [];
            renderBingoCard(platformState.rooms.bingo.myCard, ev.calledNumbers || []);
          }
        });

        socket.on('bingo:state', () => socket.emit('platform:sync'));
        socket.on('round:open', () => socket.emit('platform:sync'));
        socket.on('round:settled', () => socket.emit('platform:sync'));
      }
    }

    renderKenoGrid();
    renderBingoCard(null, []);
    connectServer();
  </script>
</body>
</html>
