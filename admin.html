<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XLiteBingo Admin</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#08111f;color:#e5eefb;font:15px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:23px;margin:8px 0}.muted{color:#91a4bd}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin:18px 0}.card,section{background:#111f32;border:1px solid #263a55;border-radius:14px;padding:14px}.num{font-size:25px;font-weight:800;margin-top:6px}input,button{border:1px solid #38516f;border-radius:9px;padding:10px;background:#0a1728;color:#fff}button{cursor:pointer;background:#126b63;border:0;font-weight:700;margin:3px}button.danger{background:#a73548}button.secondary{background:#344963}section{margin:14px 0;overflow:auto}h2{font-size:18px;margin:0 0 12px}table{width:100%;border-collapse:collapse;min-width:600px}td,th{text-align:left;padding:10px;border-bottom:1px solid #293b52;font-size:13px}th{color:#9db1ca}.status{font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.notice{padding:12px;border-radius:10px;background:#3a2630;color:#ffd6df;margin:12px 0;display:none}
</style></head><body><main><div class="top"><div><h1>🛠 XLiteBingo Admin</h1><div class="muted">Authenticated with your Telegram account</div></div><button onclick="loadAll()">↻ Refresh</button></div><div id="notice" class="notice"></div><div class="grid" id="stats"></div>
<section><h2>Deposit / Withdrawal requests</h2><div id="requests">Loading…</div></section>
<section><h2>User management</h2><div class="row"><input id="search" placeholder="Telegram ID, name, username or phone"><button onclick="loadUsers()">Search</button></div><div id="users">Search to display users.</div></section>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const headers={'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||''};
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{...headers,...opts.headers}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||`HTTP ${r.status}`);return d}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fail(e){const n=document.getElementById('notice');n.textContent=e.message;n.style.display='block'}
async function loadOverview(){const d=await api('/api/admin/overview');const s=d.stats;document.getElementById('stats').innerHTML=[['Users',s.users],['Main balance',Number(s.mainBalance).toFixed(2)+' ETB'],['Pending deposits',s.pendingDeposits],['Pending withdrawals',s.pendingWithdrawals],['Rounds',s.rounds]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="num">${x[1]}</div></div>`).join('')}
async function loadRequests(){const d=await api('/api/admin/requests');const rows=d.requests.map(r=>`<tr><td>${esc(r.type)}</td><td>${esc(r.user_id)}</td><td>${Number(r.amount||0).toFixed(2)} ETB</td><td class="status">${esc(r.status)}</td><td>${r.created_at?new Date(Number(r.created_at)).toLocaleString():''}</td><td>${r.status==='pending'?`<button onclick="review('${esc(r.id)}','${r.type}',true)">Approve</button><button class="danger" onclick="review('${esc(r.id)}','${r.type}',false)">Reject</button>`:'—'}</td></tr>`).join('');document.getElementById('requests').innerHTML=`<table><thead><tr><th>Type</th><th>User ID</th><th>Amount</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody>${rows||'<tr><td colspan="6">No requests found.</td></tr>'}</tbody></table><p class="muted">Receipt photos are also sent to the admin chat in Telegram. Approving a withdrawal only marks it approved; the admin must send the payout externally.</p>`}
async function review(id,type,approve){if(!confirm(`${approve?'Approve':'Reject'} ${type} request ${id}?`))return;try{await api('/api/admin/review',{method:'POST',body:JSON.stringify({id,type,approve})});await loadAll()}catch(e){fail(e)}}
async function loadUsers(){try{const q=document.getElementById('search').value;const d=await api('/api/admin/users?q='+encodeURIComponent(q));document.getElementById('users').innerHTML=`<table><thead><tr><th>User</th><th>Name</th><th>Phone</th><th>Balance</th><th>Actions</th></tr></thead><tbody>${d.users.map(u=>`<tr><td>${esc(u.id)}</td><td>${esc(u.first_name||u.username||'')}</td><td>${esc(u.phone_number||'')}</td><td>${Number(u.balance||0).toFixed(2)} ETB</td><td><button onclick="userAction('${esc(u.id)}','block')">Block</button><button class="secondary" onclick="userAction('${esc(u.id)}','unblock')">Unblock</button><button onclick="adjust('${esc(u.id)}','credit')">+ Balance</button><button class="danger" onclick="adjust('${esc(u.id)}','debit')">− Balance</button></td></tr>`).join('')||'<tr><td colspan="5">No users.</td></tr>'}</tbody></table>`}catch(e){fail(e)}}
async function userAction(userId,action){try{await api('/api/admin/user-action',{method:'POST',body:JSON.stringify({userId,action})});await loadUsers()}catch(e){fail(e)}}
async function adjust(userId,action){const amount=Number(prompt('Amount in ETB'));if(!Number.isFinite(amount)||amount<=0)return;try{await api('/api/admin/user-action',{method:'POST',body:JSON.stringify({userId,action,amount})});await loadUsers();await loadOverview()}catch(e){fail(e)}}
async function loadAll(){document.getElementById('notice').style.display='none';try{await Promise.all([loadOverview(),loadRequests()])}catch(e){fail(e)}}
loadAll();
</script></main></body></html>
